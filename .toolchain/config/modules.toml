[module]
kind = "library"
test = true
folder = "built"
include = ["{bridge}/include", "include", "tests/modules"]
flags = ["{hidden}", "{system_defines}"]
sources = ["tests/modules/{name}.c"]

[[modules]]
name = "nmover"
sources = ["tests/modules/nmover.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "nflood"
sources = ["tests/modules/nflood.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "nforeign"
sources = ["tests/modules/nforeign.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "nsetter"
sources = ["tests/modules/nsetter.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "nwatcher"
sources = ["tests/modules/nwatcher.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "nstamp5"
sources = ["tests/modules/nstamp.c", "tests/modules/nidle.c"]
defines = ["VALUE=5", "PHASE=\"update\""]
variants = [{ name = "nstamp9", defines = ["VALUE=9", "PHASE=\"update\""] }]
path = true

[[modules]]
name = "nsingle"
sources = ["tests/modules/nsingle/*.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "ntoggle"
sources = ["tests/modules/ntoggle/*.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "ntag"
sources = ["tests/modules/ntag/*.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "ndirect"
sources = ["tests/modules/ndirect/*.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "nsparse"
sources = ["tests/modules/nsparse/*.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "nlayout0"
sources = ["tests/modules/nlayout/*.c"]
defines = ["V=0", "KEPT=1"]
path = true

[[modules]]
name = "nalloc"
sources = ["tests/modules/nalloc.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "nnoinit"
path = true

[[modules]]
name = "ncover"
sources = ["tests/modules/ncover.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "nsay"
sources = ["tests/modules/nsay/*.c", "tests/modules/nidle.c"]
path = true

[[modules]]
name = "nkeep_component"
sources = ["tests/modules/nkeep.c", "tests/modules/nidle.c"]
defines = ["KEPT_BY=1"]
variants = [{ name = "nkeep_declare", defines = ["KEPT_BY=2"] }, { name = "nkeep_tag", defines = ["KEPT_BY=3"] }, { name = "nkeep_none", defines = ["KEPT_BY=0"] }]
path = true

[[modules]]
name = "norder"
sources = ["tests/modules/norder.c", "tests/modules/nidle.c"]
defines = ["SYSTEMS_ORDERED=1", "OBSERVERS_ORDERED=1"]
variants = [{ name = "norder_systems", defines = ["SYSTEMS_ORDERED=0", "OBSERVERS_ORDERED=1"] }, { name = "norder_observers", defines = ["SYSTEMS_ORDERED=1", "OBSERVERS_ORDERED=0"] }]
path = true
