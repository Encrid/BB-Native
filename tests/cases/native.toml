[[case]]
name = "native-direct"
run = ["{out}/native-direct{exe}"]
env = { TEST_COPIES = "{case}/copies" }
claims = { status = 0 }
rows = [
    { name = "define_func-an-entry-the-abi-has-not-refused", in = "teleport", claims = { matches = ["an entry the SDK has not is refused: the native SDK has no entry 'teleport'"] }, false = "declare" },
    { name = "define_func-another-namespace-refused", in = "teleport", claims = { matches = ["another namespace is refused: the native SDK has no entry 'spawn'"] }, false = "declare" },
    { name = "native_enter-an-entry-that-is-set-runs", in = "enter-set", claims = { line = ["enter-set: init 85, calls 2"] }, false = "enter-unset" },
    { name = "native_enter-an-unset-entry-gives-0", in = "enter-unset", claims = { line = ["enter-unset: init 0, calls 0"] }, false = "enter-set" },
    { name = "native_enter-after-a-refusal-each-entry-gives-0", in = "enter-refused", claims = { line = ["enter-refused: init 0, calls 1"] }, false = "enter-set" },
    { name = "native_enter-an-entry-after-its-call-returned-gives-0", in = "enter-late", claims = { line = ["late 0, calls 2"] }, false = "enter-set" },
]

[[case]]
name = "a name of a system that is a pointer stops the build, with the error of an array of a negative size"
process = "status"
run = ["{python}", "{root}/tools/compile_one.py", "{root}/tests/refused/name_pointer.c", "{root}/include", "{bridge}/include"]
claims = { status = 1, has = ["name_pointer.c:10:13: error: array size is negative"] }
false = { run = ["{python}", "{root}/tools/compile_one.py", "{root}/tests/refused/name_literal.c", "{root}/include", "{bridge}/include"] }
