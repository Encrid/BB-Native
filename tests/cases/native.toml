code = ["include/**", "src/**", "tests/**", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "native-host"
run = ["{out}/native-host{exe}"]
env = { TEST_COPIES = "{case}/copies", TEST_CONTENT = "{case}/nbuild.module", TEST_IMPORTS = "{case}/m", TEST_ALONE = "{case}/alone" }
sweep = ["calloc", "os_file_link"]
claims = { status = 0 }
rows = [
    { name = "BRIDGE_NATIVE-system-reads-and-writes", in = "BRIDGE_NATIVE-system-reads-and-writes", claims = { matches = ["game:mover@0.1.0/tally: native tally 2 1000.*native tally 2 1000.*alive"] }, false = "BRIDGE_NATIVE-a-module-of-999-entities" },
    { name = "BRIDGE_NATIVE_COMPONENT-declared", in = "BRIDGE_NATIVE_COMPONENT-declared", claims = { matches = ["game:mover@0.1.0/tally: native tally 2 1000.*native tally 2 1000.*alive"] }, false = "BRIDGE_NATIVE-a-module-of-999-entities" },
    { name = "BRIDGE_NATIVE_ADD_SYSTEM-registered-and-run", in = "BRIDGE_NATIVE_ADD_SYSTEM-registered-and-run", claims = { matches = ["game:mover@0.1.0/tally: native tally 2 1000.*native tally 2 1000.*alive"] }, false = "BRIDGE_NATIVE-a-module-of-999-entities" },
    { name = "bridge_native_get_query-the-query-of-a-system", in = "bridge_native_get_query-the-query-of-a-system", claims = { matches = ["game:mover@0.1.0/tally: native tally 2 1000.*native tally 2 1000.*alive"] }, false = "BRIDGE_NATIVE-a-module-of-999-entities" },
    { name = "bridge_native_get_span-two-tables-walked", in = "bridge_native_get_span-two-tables-walked", claims = { matches = ["game:mover@0.1.0/tally: native tally 2 1000.*native tally 2 1000.*alive"] }, false = "BRIDGE_NATIVE-a-module-of-999-entities" },
    { name = "bridge_native_get_rows-rows-of-the-spans-of-a-query", in = "bridge_native_get_rows-rows-of-the-spans-of-a-query", claims = { matches = ["game:mover@0.1.0/tally: native tally 2 1000.*native tally 2 1000.*alive"] }, false = "BRIDGE_NATIVE-a-module-of-999-entities" },
    { name = "bridge_native_get_block-ids-of-the-rows-of-a-span", in = "bridge_native_get_block-ids-of-the-rows-of-a-span", claims = { matches = ["seen 1 9.*alive"], lacks = ["seen 1 5"] }, false = "BRIDGE_NATIVE_PUT_SLOTS-the-order-nine-first" },
    { name = "bridge_native_log-a-line-with-two-numbers", in = "bridge_native_log-a-line-with-two-numbers", claims = { matches = ["game:mover@0.1.0/tally: native tally 2 1000.*native tally 2 1000.*alive"] }, false = "BRIDGE_NATIVE-a-module-of-999-entities" },
    { name = "bridge_native_in_arena-each-edge-of-the-arena", in = "bridge_native_in_arena-each-edge-of-the-arena", claims = { matches = ["in-arena 9 1.*test:text@0.1.0: loaded.*alive"] }, false = "bridge_native_in_arena-each-text-1-byte-longer" },
    { name = "bridge_native_find_value-the-value-of-a-live-entity", in = "bridge_native_find_value-the-value-of-a-live-entity", claims = { matches = ["game:find@0.1.0/find: find live 42 0 .*alive"] }, false = "bridge_native_find_value-a-live-value-of-43" },
    { name = "bridge_native_find_value-0-for-a-component-that-the-entity-lacks", in = "bridge_native_find_value-0-for-a-component-that-the-entity-lacks", claims = { matches = ["game:find@0.1.0/find: find missing 0 0 .*alive"] }, false = "bridge_native_find_value-an-entity-that-carries-the-component" },
    { name = "bridge_native_find_value-0-for-a-stale-id", in = "bridge_native_find_value-0-for-a-stale-id", claims = { matches = ["game:find@0.1.0/find: find stale 0 0 .*alive"] }, false = "bridge_native_find_value-an-id-that-stays-live" },
    { name = "bridge_native_find_value-0-for-an-index-outside-the-entity-index", in = "bridge_native_find_value-0-for-an-index-outside-the-entity-index", claims = { matches = ["game:find@0.1.0/find: find far 0 0 .*alive"] }, false = "bridge_native_find_value-an-index-inside-the-entity-index" },
    { name = "bridge_native_find_value-BRIDGE_CARRIED-for-a-tag", in = "bridge_native_find_value-BRIDGE_CARRIED-for-a-tag", claims = { matches = ["game:find@0.1.0/find: find tag 1 .*alive"] }, false = "bridge_native_find_value-an-entity-without-the-tag" },
    { name = "BRIDGE_NATIVE_ATTACH-seen-by-an-observer", in = "BRIDGE_NATIVE_ATTACH-seen-by-an-observer", claims = { matches = ["b2 game:setter@0.1.0/mark: marked.*b2 view:watcher@0.1.0/seen: seen 1 77.*alive"] }, false = "BRIDGE_NATIVE_ATTACH-a-value-of-78-seen" },
    { name = "bridge_native_lend-a-value-lent-to-attach", in = "bridge_native_lend-a-value-lent-to-attach", claims = { matches = ["seen 1 77.*alive"] }, false = "BRIDGE_NATIVE_ATTACH-a-value-of-78-seen" },
    { name = "BRIDGE_NATIVE_PUT_SLOTS-changes-stated-and-made", in = "BRIDGE_NATIVE_PUT_SLOTS-changes-stated-and-made", claims = { matches = ["seen 1 9.*alive"], lacks = ["seen 1 5"] }, false = "BRIDGE_NATIVE_PUT_SLOTS-the-order-nine-first" },
    { name = "bridge_api_t-entry-from-a-foreign-thread-refused", in = "bridge_api_t-entry-from-a-foreign-thread-refused", claims = { matches = ["test:foreign@0.1.0/reach: an id from another thread, and from this one 0 1.*alive"] }, false = "bridge_api_t-entry-from-this-thread-kept" },
    { name = "call-an-entry-refused-fails-the-invocation", in = "call-an-entry-refused-fails-the-invocation", claims = { matches = ["test:flood@0.1.0/flood: system 'flood' failed: spawn: its spawns of 1024 between two barriers are used up.*alive"] }, false = "call-an-entry-kept-ends-the-invocation" },
    { name = "backend_get_capabilities-work-limit-refused", in = "backend_get_capabilities-work-limit-refused", claims = { matches = ["is refused: it states work_limit, which backend 'native' cannot keep.*alive"], lacks = ["cannot open"] }, false = "backend_get_capabilities-no-limit-stated" },
    { name = "backend_get_capabilities-memory-limit-refused", in = "backend_get_capabilities-memory-limit-refused", claims = { matches = ["is refused: it states memory_limit, which backend 'native' cannot keep.*alive"], lacks = ["cannot open"] }, false = "backend_get_capabilities-no-limit-stated" },
    { name = "backend_get_capabilities-timeout-refused", in = "backend_get_capabilities-timeout-refused", claims = { matches = ["is refused: it states shutdown_timeout, which backend 'native' cannot keep.*alive"], lacks = ["cannot open"] }, false = "backend_get_capabilities-no-limit-stated" },
    { name = "backend_get_capabilities-element-limit-refused", in = "backend_get_capabilities-element-limit-refused", claims = { matches = ["is refused: it states element_limit, which backend 'native' cannot keep.*alive"], lacks = ["cannot open"] }, false = "backend_get_capabilities-no-limit-stated" },
    { name = "module_compile-no-path-refused", in = "module_compile-no-path-refused", claims = { matches = ["did not load: this backend opens a module's library by its path, and was handed none.*alive"] }, false = "module_compile-library-cannot-open" },
    { name = "module_compile-library-cannot-open", in = "module_compile-library-cannot-open", claims = { matches = ["did not load: cannot open the library 'no-such-library'.*alive"] }, false = "module_compile-no-path-refused" },
    { name = "backend_create-a-setting-refused", in = "backend_create-a-setting-refused", claims = { matches = ["backend 'native' would not start: it knows no setting 'cache'.*bridge_create refused.*alive"] }, false = "backend_create-no-copies-refused" },
    { name = "backend_create-no-copies-refused", in = "backend_create-no-copies-refused", claims = { matches = ["backend 'native' would not start: it needs the setting copies: a folder for the copies of the modules.*bridge_create refused.*alive"] }, false = "backend_create-a-setting-refused" },
    { name = "backend_create-copies-of-another-kind-refused", in = "backend_create-copies-of-another-kind-refused", claims = { matches = ["backend 'native' would not start: the setting copies is a folder, as a text.*bridge_create refused.*alive"] }, false = "backend_create-copies-2-times-refused" },
    { name = "backend_create-copies-2-times-refused", in = "backend_create-copies-2-times-refused", claims = { matches = ["backend 'native' would not start: it states the setting copies 2 times.*bridge_create refused.*alive"] }, false = "backend_create-copies-of-another-kind-refused" },
    { name = "backend_create-copies-empty-refused", in = "backend_create-copies-empty-refused", claims = { matches = ["backend 'native' would not start: the setting copies is a folder, as a text.*bridge_create refused.*alive"] }, false = "backend_create-copies-2-times-refused" },
    { name = "module_compile-a-reload-by-the-same-path-gives-each-new-build", in = "module_compile-a-reload-by-the-same-path-gives-each-new-build", claims = { matches = ["write 1: 0.*test:build@0.1.0: loaded.*build 1 0.*write 2: 0.*reload 2: 0.*build 2 0.*write 3: 0.*reload 3: 0.*build 3 0.*alive"] }, false = "module_compile-a-reload-by-the-same-path-gives-the-first-build" },
    { name = "module_compile-a-copy-of-the-bytes-of-the-host", in = "module_compile-a-copy-of-the-bytes-of-the-host", claims = { matches = ["build 1 0.*write 2: 0.*reload 2: 0.*build 2 0.*write 3: 0.*reload 3: 0.*build 3 0.*alive"] }, false = "module_compile-a-reload-by-the-same-path-gives-the-first-build" },
    { name = "backend_create-removes-only-its-copies", in = "backend_create-removes-only-its-copies", claims = { matches = ["7-old.module gone.*keep.txt stays.*8- stays.*x-y stays.*77x stays.*12/f gone.*9-dir/f stays.*dir/f stays"] }, false = "backend_create-a-setting-refused" },
    { name = "module_compile-a-module-finds-the-library-beside-its-file", in = "module_compile-a-module-finds-the-library-beside-its-file", claims = { matches = ["test:imports@0.1.0: loaded.*helped 7 0.*alive"] }, false = "module_compile-a-module-with-no-library-beside-its-file" },
    { name = "module_compile-a-module-with-no-library-beside-its-file", in = "module_compile-a-module-with-no-library-beside-its-file", claims = { matches = ["did not load: cannot open the library '.*nimports.module'.*alive"] }, false = "module_compile-a-module-finds-the-library-beside-its-file" },
    { name = "module_compile-the-library-beside-a-loaded-module-moves-free", in = "module_compile-the-library-beside-a-loaded-module-moves-free", claims = { matches = ["helped 7 0.*move: 0.*alive"] }, false = "module_compile-a-move-of-no-library-fails" },
    { name = "module_compile-each-refused-link-copies-a-library-and-skips-the-rest", in = "module_compile-each-refused-link-copies-a-library-and-skips-the-rest", claims = { matches = ["links: 4 refused, 5 loads of 5"] }, false = "module_compile-each-refused-link-with-no-library-beside" },
    { name = "module_compile-no-memory-for-the-folder-of-a-generation-refused", in = "+refuse calloc=4 module_compile-no-memory-for-the-folder-of-a-generation-refused", claims = { matches = ["did not load: out of memory: there was none for the path of a copy.*alive"] }, false = "module_compile-no-memory-for-the-folder-of-a-generation-refused" },
    { name = "module_compile-the-folder-of-a-generation-cannot-be-made-refused", in = "+refuse os_folder_make=2 module_compile-the-folder-of-a-generation-cannot-be-made-refused", claims = { matches = ["did not load: cannot make the folder of a copy '.*'.*alive"] }, false = "module_compile-the-folder-of-a-generation-cannot-be-made-refused" },
    { name = "module_compile-a-folder-beside-it-that-does-not-list", in = "+refuse os_folder_open=2 module_compile-a-folder-beside-it-that-does-not-list", claims = { matches = ["game:mover@0.1.0/tally: native tally 2 1000.*alive"] }, false = "module_compile-a-module-with-no-library-beside-its-file" },
    { name = "module_compile-no-memory-for-the-source-of-a-file-beside-it", in = "+refuse calloc=6 module_compile-no-memory-for-the-source-of-a-file-beside-it", claims = { matches = ["did not load: cannot open the library '.*nimports.module'.*alive"] }, false = "module_compile-a-module-finds-the-library-beside-its-file" },
    { name = "module_compile-no-memory-for-the-name-of-a-file-beside-it", in = "+refuse calloc=7 module_compile-no-memory-for-the-name-of-a-file-beside-it", claims = { matches = ["did not load: cannot open the library '.*nimports.module'.*alive"] }, false = "module_compile-a-module-finds-the-library-beside-its-file" },
    { name = "backend_create-copies-null-refused", in = "backend_create-copies-null-refused", claims = { matches = ["backend 'native' would not start: the setting copies is a folder, as a text.*bridge_create refused.*alive"] }, false = "backend_create-copies-2-times-refused" },
    { name = "backend_create-a-folder-that-does-not-list", in = "+refuse os_folder_open=1 backend_create-a-folder-that-does-not-list", claims = { matches = ["game:mover@0.1.0/tally: native tally 2 1000.*alive"] }, false = "backend_create-a-setting-refused" },
    { name = "backend_create-a-folder-that-cannot-be-made-refused", in = "+refuse os_folder_make=1 backend_create-a-folder-that-cannot-be-made-refused", claims = { matches = ["backend 'native' would not start: cannot make the folder of the copies '.*copies'.*bridge_create refused.*alive"] }, false = "backend_create-a-folder-that-cannot-be-made-refused" },
    { name = "module_compile-no-memory-for-the-folder-refused", in = "+refuse calloc=2 module_compile-no-memory-for-the-folder-refused", claims = { matches = ["backend 'native' would not start: out of memory: there was none for the folder of the copies.*bridge_create refused.*alive"] }, false = "module_compile-no-memory-for-the-folder-refused" },
