    { name = "instance_get_func-no-memory-refused", in = "+refuse calloc=9 instance_get_func-no-memory-refused", claims = { matches = ["module 'game:mover@0\\.1\\.0' did not load: out of memory: there was none for a function of an instance.*alive"] }, false = "instance_get_func-no-memory-refused" },
    { name = "bridge_native_get_single-the-one-row", in = "bridge_native_get_single-the-one-row", claims = { matches = ["it has no value 0 0.*it has a value: gravity, wind 10 1.*wind 20 2.*wind 20 77.*alive"] }, false = "bridge_native_get_single-with-no-attach_a" },
